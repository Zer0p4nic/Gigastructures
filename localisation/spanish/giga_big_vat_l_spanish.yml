  giga_maximum_mutation_title:0 "§cMutación Máxima§!"
  giga_maximum_mutation_desc:0 "En la búsqueda de nuestro destino genético, todas las avenidas posibles deben ser consideradas, por extrañas y esotéricas que parezcan."
  
  giga_prethoryn_larvae:0 "Larva Mutada"
  giga_prethoryn_larvae_desc_short:0 "Una pequeña larva retorciéndose. Crecimiento extremadamente rápido. Podría ser aplastada bajo los pies."
  giga_prethoryn_larvae_desc_details:99 ""
  
  giga_vat_maximum_mutation_1:0 "Mutación Máxima: Inceptus"
  giga_vat_maximum_mutation_2:0 "Mutación Máxima: Virulus"
  giga_vat_maximum_mutation_3:0 "Mutación Máxima: Aureus"
  giga_vat_maximum_mutation_4:0 "Mutación Máxima: Exaltus"
  giga_vat_maximum_mutation_1_DESC:0 "El inicio es de gran importancia, definiendo cómo progresarán nuestras mutaciones. Solo el tiempo dirá si este proyecto dará frutos como sus benefactores dicen."
  giga_vat_maximum_mutation_2_DESC:0 "Los siguientes pasos son tan importantes como el primero. ¿Cómo puede uno tener un palacio sin una base sólida?"
  giga_vat_maximum_mutation_3_DESC:0 "Con cualquier proyecto, las revisiones y revisiones deben hacerse. ¿Cómo podemos mejorar nuestro diseño? ¿Qué defectos podemos minimizar? Ahora es el momento para que nuestros especímenes asciendan a la perfección."
  giga_vat_maximum_mutation_4_DESC:0 "La piedra angular completa cualquier gran obra, no sea que se derrumbe bajo su propio peso."
  
  giga_vat_events.100.name:0 "Maximizando la Mutación"
  giga_vat_events.100.desc:0 "Con acceso a una amplia y eficiente gama de dispositivos de clonación, nuestros científicos han ideado una idea bastante peculiar. ¿Qué resultaría de combinar y mutar cada muestra de material genético que nuestro imperio ha recolectado, sin importar lo que sea? Aunque la idea es extraña, podría llevar a avances en biología y quizás las criaturas que conciba este proyecto tengan aplicaciones en el escenario de la guerra galáctica."
  giga_vat_events.100.a:0 "¿Qué podría salir mal?"
  
  giga_vat_events.101.name:0 "Inceptus"
  giga_vat_events.101.desc:0 "Con resultados iniciales prometedores, los científicos en [capital.GetName] se preparan para experimentos a mayor escala. Con los extensos laboratorios de $name_the_vat$, buscan obtener un espécimen del tamaño de una corbeta. Si sus capacidades estarán por debajo o por encima de las de una corbeta, está por verse."
  giga_vat_events.101.a:99 "$INTRIGUING$"
  
  giga_vat_events.1011.name:0 "Concepción de Inceptus"
  giga_vat_events.1011.desc:0 "Lo vimos crecer. Lo vimos alimentarse. A través de todo ello, ira, miedo, frustración. No sabíamos cómo conocíamos sus sentimientos. Era tan gigantesco, pero aún tan pequeño, todavía asustado de nosotros. Podría aplastarnos o derretirnos en un instante. ¿Por qué estaba asustado? ¿Asustado de lo que le haríamos si nos atacaba? ¿O asustado de lo que crearíamos después?"
  giga_vat_events.1011.a:99 "$DISCONCERTING$"
  
  giga_vat_events.102.name:0 "Virulus"
  giga_vat_events.102.desc:0 "Tras el éxito de Inceptus, los científicos principales proponen un experimento aún mayor, del tamaño de un destructor. Aunque muchos en el equipo tienen reservas, se dio luz verde y comenzó el progreso para mutar aún más."
  giga_vat_events.102.a:99 "$GOOD$"
  
  giga_vat_events.1021.name:0 "Una Fuerza Virulenta"
  giga_vat_events.1021.desc:0 "Ira. Toda emoción secundaria a la mezcla de violencia y enojo. Se agitaba contra sus restricciones que le impedían destrozar la estación. Días se agitó, ¿era su ira interminable? Mientras tanto, sentíamos cambios en nuestros especímenes más pequeños, sentimientos similares de ira mezclada con miedo. Parecen compartir un vínculo, algo más grande que un simple lazo familiar, como si fueran partes de un organismo mayor."
  giga_vat_events.1021.a:99 "$DISTURBING$"
  
  giga_vat_events.103.name:0 "Aureus"
  giga_vat_events.103.desc:0 "Desde el inicio del proyecto, nuestros almirantes y otros miembros del personal militar han mostrado gran interés en este proyecto. Solicitan un espécimen con capacidades casi de portaaviones. Muchos científicos en $name_the_vat$ han renunciado o se niegan a trabajar, pero unos pocos selectos continúan en busca de la perfección."
  giga_vat_events.103.a:99 "$INCREDIBLE$"
  
  giga_vat_events.1031.name:0 "Ascensión Biológica"
  giga_vat_events.1031.desc:0 "Ira de nuevo. Monumental comparada con antes. La agitación también era más fuerte. Un día todo se detuvo. Solo un sentimiento se sintió ese día. Obediencia. Lo habían logrado, habían controlado a esta criatura indómita que habían creado. Se había sometido, y con ella todos los demás especímenes. No más ira, miedo o frustración. La obediencia brillaba. El organismo nos ha aceptado."
  giga_vat_events.1031.a:99 "$ASTOUNDING$"
  
  giga_vat_events.104.name:0 "Exaltus"
  giga_vat_events.104.desc:0 "Habíamos alcanzado la perfección, pero ¿y si vamos más allá? Después de alcanzar la grandeza, ¿podría haber más? Algunos en el equipo dicen, ¿por qué no llegar tan alto como sea posible? Si tiene éxito, el paso final en la evolución podría realizarse."
  giga_vat_events.104.a:99 "$UNDERSTOOD$"
  
  giga_vat_events.1041.name:0 "Mutación Maximizada"
  giga_vat_events.1041.desc:0 "La forma de vida definitiva, nuestros hermosos especímenes, finalmente creados y realizados ante nosotros. Su fuerza hará que nuestros enemigos lo piensen dos veces antes de desafiarnos en el escenario galáctico. Hemos ganado algo único de este proyecto. Nuestros especímenes y nosotros tenemos esta conexión. Nuestras mentes y las suyas entrelazadas como una sola entidad. Si una fuerza como esta se liberara en una galaxia, no hay forma de saber qué podría pasar. A lo largo del programa hubo algunos intentos de escape por parte de nuestros especímenes. Afortunadamente, todos fueron eliminados. Aunque hubo unos pocos que escaparon y se dirigieron hacia el espacio intergaláctico. Seguramente no causarán problemas."
  giga_vat_events.1041.a:0 "Seguramente..."
  
