l_spanish:
  
  giga_gas_giant_home_system_NAME:0 "Inicio en un Gigante Gaseoso"
  giga_gas_giant_home_system_DESC:0 "Comienza en un gigante gaseoso habitable con tu mundo natal original destruido."
  origin_gas_giant:0 "Volemos al Gigante Gaseoso"
  origin_gas_giant_desc:0 "Esta especie perdió su mundo natal durante su temprana era espacial cuando un cometa gigante se estrelló en él. Afortunadamente, ya poseían suficiente infraestructura en el espacio para evitar la extinción total. Y un gigante gaseoso con una atmósfera inusualmente tranquila que estaban utilizando para la minería de combustible se convirtió en su nuevo hogar."
  origin_gas_giant_robot:0 "Despegue del Gigante Gaseoso"
  origin_gas_giant_robot_desc:0 "Durante la temprana era espacial de este imperio, su mundo natal fue impactado por un cometa perdido. Ya poseían suficiente infraestructura en el espacio para sobrevivir temporalmente, y una estación minera en un gigante gaseoso se convirtió en su nuevo hogar. A lo largo de los años, el gigante gaseoso ha satisfecho sus necesidades muchas veces, aportando nuevas ideas sobre los diversos gases que se encuentran en la galaxia. Debido a la abundancia de gases exóticos durante el desarrollo de este imperio, se han refinado técnicas industriales mejoradas utilizando estos gases, aunque con una dependencia de ellos incluso para la industria más básica."
  
  origin_gas_giant_effects:0 "Comienza en un $pc_habitable_gas_giant$ con tu mundo natal original destruido.\n- Obtén acceso a la tecnología £engineering_research£ §L$tech_space_mining_1$§!.\n- Obtén acceso a la tecnología £society_research£ §L$tech_hydroponics$§! si el imperio tiene poblaciones biológicas."
  origin_gas_giant_effects_robot:0 "- $HOMEWORLD$ ['concept_giga_habitable_gas_giant'] (Tamaño: £planetsize£ 16-28)$NEW_LINE$- Rasgo de Especie:$TABBED_NEW_LINE$- ['trait:trait_giga_gas_giant_hab_robot']$NEW_LINE$- $ADDITONAL_TECHNOLOGIES_STRING$ ['technology:tech_space_mining_1', £engineering_research£ $tech_space_mining_1$]"
  
  concept_giga_habitable_gas_giant:0 "$pc_habitable_gas_giant$"
  concept_giga_habitable_gas_giant_desc:0 "$pc_habitable_gas_giant_desc$"
  
  concept_giga_gas_worlds:0 "Mundo de Gas"
  concept_giga_gas_worlds_desc:0 "Gigantes gaseosos habitables, planetas con atmósferas artificialmente inundadas de gas y algunos mundos tóxicos ligeramente más habitables se categorizan como \"Mundos de Gas\"."
  
  building_giga_gas_giant_habitation_module:0 "Módulo Habitacional del Gigante Gaseoso"
  building_giga_gas_giant_habitation_module_desc:0 "Colección de instalaciones necesarias para mantener una colonia en un gigante gaseoso ensamblada por la población original de este planeta. Estas instalaciones incluyen reactores para proporcionar energía a la colonia, bahías de atraque para descargar minerales recolectados de las lunas locales y grandes hangares con control climático que pueden ser utilizados para granjas hidropónicas. Además de eso, estas instalaciones sirven como sede para la red de distribución de recursos y proporcionan diversos servicios a las poblaciones locales."
  
  trait_giga_gas_giant_hab:0 "Dependiente de Gases Exóticos"
  trait_giga_gas_giant_hab_desc:0 "§LLos siglos de exposición a gases exóticos mientras vivían en un gigante gaseoso han hecho que esta especie dependa en cierta medida de ellos en sus funciones diarias.§!"
  trait_giga_gas_giant_hab_tooltip:0 "§YCiencia§! y §YIndustrial§! Costo de mantenimiento de gases exóticos: §R+0.03§!\nUso de Vivienda en mundos de ['concept_giga_gas_worlds', §YGas§!]: §G-10%§!\nCosto de mantenimiento de £job_researcher£ $job_researcher$ en mundos de ['concept_giga_gas_worlds', §YGas§!]: §G-10%§!\nCosto de mantenimiento de gases exóticos en mundos de ['concept_giga_gas_worlds', §YGas§!]: §G-33%§!\nUso de Vivienda en mundos no ['concept_giga_gas_worlds', §YGas§!]: §R+30%§!\nHabitabilidad en mundos no ['concept_giga_gas_worlds', §YGas§!]: §R-20%§!\nCosto de mantenimiento de gases exóticos en mundos no ['concept_giga_gas_worlds', §YGas§!]: §R+50%§!"
  trait_giga_gas_giant_hab_robot:0 "Alimentado por Gases Exóticos"
  trait_giga_gas_giant_hab_robot_desc:0 "§LPequeñas automodificaciones a lo largo del tiempo han resultado en una dependencia casi total de los gases exóticos para alimentar estas máquinas."
  trait_giga_gas_giant_hab_robot_tooltip:0 "$trait_giga_gas_giant_hab_tooltip$"
  
